name: WakaTime
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
    steps:
      # Skipped (not failed) until the WAKATIME_API_KEY secret exists.
      - if: env.WAKATIME_API_KEY != ''
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TOTAL: "true"
          TIME_RANGE: last_7_days
          LANG_COUNT: "6"
